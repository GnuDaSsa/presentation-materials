<!doctype html>
<html lang="ko"><head><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>성남 영어발표 · 프롬프터</title><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#071426;color:#f3f7ff;font:20px system-ui,sans-serif}header{position:sticky;top:0;background:#10243c;padding:12px 22px;display:flex;gap:12px;align-items:center;justify-content:space-between;z-index:2;box-shadow:0 5px 24px #0005}button{border:1px solid #6d8aaa;background:#173553;color:white;border-radius:9px;padding:10px 15px;font-size:17px}main{max-width:1050px;margin:auto;padding:32vh 28px 55vh}.status{font-size:15px;color:#9cc4e8}.cue{font-size:var(--size,28px);line-height:1.35;margin:0 0 12px;padding:12px 18px;border-left:5px solid transparent;color:#aebed0;cursor:pointer;scroll-margin-top:80px}.cue.active{color:#fff;background:#17466a;border-left-color:#63d8ff;border-radius:7px;box-shadow:0 4px 22px #0004}.cue.past{opacity:.45}.cue.upcoming{color:#d5e3ef}.cue-label{display:block;font-size:12px;letter-spacing:.04em;color:#78b9dc;margin-bottom:4px}.manual-status{position:sticky;top:64px;z-index:1;text-align:center;font-size:14px;color:#abd5ef;background:#071426e8;padding:7px}h1{font-size:19px;margin:0}#slide{font-size:15px;color:#8fcfff}@media(max-width:600px){header{padding:10px 12px}header button{padding:8px;font-size:15px}main{padding-left:12px;padding-right:12px}.cue{font-size:var(--size,27px)}}
</style></head><body><header><div><h1>발표 프롬프터</h1><span id="status" class="status">연결 중…</span> · <span id="slide">1 / 12</span></div><div><button id="smaller">가−</button> <button id="larger">가+</button> <button id="follow">따라가기 ON</button></div></header><div id="manual-status" role="status" class="manual-status">대사를 누르면 PC에 자막이 뜹니다</div><main id="content" aria-label="이어지는 발표 원고"></main><script>
/* SCRIPT_DATA */
const key=new URLSearchParams(location.search).get('key'),content=document.querySelector('#content'),status=document.querySelector('#status'),slide=document.querySelector('#slide');
let current=-1,follow=true,size=28,lastState=null,pendingIndex=null,pendingRequest=null;const manualStatus=document.querySelector('#manual-status');
async function selectCue(i){
 const cue=prepared.cues[i];if(!cue)return;const requestId=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);pendingRequest=requestId;pendingIndex=i;manualStatus.textContent='PC에 자막 전송 중…';
 try{const r=await fetch('/cue?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:cue.id,slide:cue.slide,requestId})});
  if(!r.ok)throw Error();if(pendingRequest===requestId)manualStatus.textContent='PC 반영 확인 중…';
  setTimeout(()=>{if(pendingRequest===requestId){manualStatus.textContent='PC에서 반영을 확인하지 못했습니다. 원고와 연결 상태를 확인하세요.';pendingIndex=null;pendingRequest=null}},2500);
 }catch{if(pendingRequest===requestId){pendingIndex=null;pendingRequest=null;manualStatus.textContent='전송하지 못했습니다. PC에서 발표 시작 및 앱 최신 버전을 확인하세요.'}} 
}
const rows=prepared.cues.map((c,i)=>{const p=document.createElement('p');p.className='cue';p.dataset.index=i;p.tabIndex=0;p.setAttribute('role','button');p.setAttribute('aria-label','PC에 이 대사 자막 띄우기: '+(c.spokenLanguage==='ko'?c.ko:c.en));p.addEventListener('click',()=>selectCue(i));p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectCue(i)}});const label=document.createElement('span');label.className='cue-label';label.textContent=i===0||prepared.cues[i-1].slide!==c.slide?'장표 '+c.slide:'';p.append(label,document.createTextNode(c.spokenLanguage==='ko'?c.ko:c.en));content.append(p);return p});
function render(s){const idx=Math.max(0,Math.min(rows.length-1,Number.isInteger(s.index)?s.index:0));slide.textContent=(s.slide||prepared.cues[idx].slide)+' / 12';
 if(idx!==current){current=idx;rows.forEach((p,i)=>{p.classList.toggle('active',i===idx);p.classList.toggle('past',i<idx);p.classList.toggle('upcoming',i>idx&&i<=idx+2);if(i===idx)p.setAttribute('aria-current','true');else p.removeAttribute('aria-current')});if(follow)rows[idx]?.scrollIntoView({behavior:'smooth',block:'center'})}}
function setStatus(){status.textContent=lastState?.running?'발표 음성 따라가는 중':'발표 시작 대기'}
document.querySelector('#smaller').onclick=()=>{size=Math.max(20,size-4);document.body.style.setProperty('--size',size+'px')};document.querySelector('#larger').onclick=()=>{size=Math.min(64,size+4);document.body.style.setProperty('--size',size+'px')};document.querySelector('#follow').onclick=e=>{follow=!follow;e.target.textContent='따라가기 '+(follow?'ON':'OFF');if(follow)rows[current]?.scrollIntoView({behavior:'smooth',block:'center'})};
render({slide:1,index:0});let fallback=null;const applyState=s=>{lastState=s;render(s);setStatus();if(pendingIndex!==null && s.index===pendingIndex && s.ack===pendingRequest){manualStatus.textContent='선택한 자막 표시됨 · 음성 인식 계속';pendingIndex=null;pendingRequest=null}};
const events=new EventSource('/events?key='+encodeURIComponent(key));events.onopen=()=>{if(fallback){clearInterval(fallback);fallback=null}if(lastState)setStatus();else status.textContent='발표 화면 연결됨'};events.onmessage=e=>{try{applyState(JSON.parse(e.data))}catch{}};
async function pollFallback(){try{const r=await fetch('/state?key='+encodeURIComponent(key),{cache:'no-store'});if(!r.ok)throw Error();applyState(await r.json())}catch{status.textContent='연결 재시도 중 · 같은 Wi-Fi인지 확인'}}
events.onerror=()=>{if(!fallback){pollFallback();fallback=setInterval(pollFallback,350)}};
</script></body></html>

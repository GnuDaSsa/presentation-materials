<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560">
<rect width="1440" height="560" fill="#FBFBF8"/>
<style>text{font-family:Pretendard,'Apple SD Gothic Neo',Arial,sans-serif;fill:#171717}.m{fill:#71706B}.r{fill:#B65A3A}.g{fill:#205A4A}.small{font-size:18px;font-weight:650}.tiny{font-size:14px;font-weight:620;letter-spacing:.3px}.label{font-size:14px;font-weight:800;letter-spacing:1.4px}.big{font-size:38px;font-weight:850}.mid{font-size:25px;font-weight:800}</style><text x="52" y="48" class="label m">5-HOUR BUILD LOG · ONE SENTENCE TO WORKFLOW</text><line x1="52" y1="70" x2="1388" y2="70" stroke="#D7D1C5"/>
<text x="52" y="122" class="big">짧은 명령 뒤에 네 개의 결정을 붙인 시간</text>
<line x1="92" y1="286" x2="1348" y2="286" stroke="#D7D1C5" stroke-width="5"/>
<circle cx="92" cy="286" r="24" fill="#B65A3A"/><text x="92" y="294" font-size="13" font-weight="850" style="fill:#fff" text-anchor="middle">1H</text><text x="92" y="352" class="mid" text-anchor="middle">표 위치</text><text x="92" y="390" class="tiny m" text-anchor="middle">이름·번호·등록일 열</text><circle cx="406" cy="286" r="24" fill="#B65A3A"/><text x="406" y="294" font-size="13" font-weight="850" style="fill:#fff" text-anchor="middle">2H</text><text x="406" y="352" class="mid" text-anchor="middle">최근 7일</text><text x="406" y="390" class="tiny m" text-anchor="middle">날짜 비교 규칙</text><circle cx="720" cy="286" r="24" fill="#B65A3A"/><text x="720" y="294" font-size="13" font-weight="850" style="fill:#fff" text-anchor="middle">3H</text><text x="720" y="352" class="mid" text-anchor="middle">중복 방지</text><text x="720" y="390" class="tiny m" text-anchor="middle">기존 연락처 확인</text><circle cx="1034" cy="286" r="24" fill="#B65A3A"/><text x="1034" y="294" font-size="13" font-weight="850" style="fill:#fff" text-anchor="middle">4H</text><text x="1034" y="352" class="mid" text-anchor="middle">연락처 등록</text><text x="1034" y="390" class="tiny m" text-anchor="middle">Apple 주소록 실행</text><circle cx="1348" cy="286" r="24" fill="#205A4A"/><text x="1348" y="294" font-size="13" font-weight="850" style="fill:#fff" text-anchor="middle">5H</text><text x="1348" y="352" class="mid" text-anchor="middle">발송 확인</text><text x="1348" y="390" class="tiny m" text-anchor="middle">대상·문구 승인</text><rect x="52" y="444" width="1336" height="62" fill="#F1EDE4"/><text x="720" y="484" class="small" text-anchor="middle">구조화 = 입력 위치 · 선택 조건 · 행동 순서 · 사람 확인 지점</text>
</svg>
